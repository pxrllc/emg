<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>EMG Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
    <link rel="stylesheet" href="unified.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <!-- TODO: アップデート -->
    <!-- <script src="https://cdn.jsdelivr.net/gh/pxrllc/emg@main/emg-cdn/emg-player.0.3.0.js"></script> -->
    <!-- ローカルのライブラリを使用中 -->
    <script src="./emg-player.0.3.0.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-name">EMG Viewer</span>
            <span class="brand-note">リファレンスプレイヤーのデモ</span>
        </div>

        <div class="loaders">
            <span class="label">デモ</span>
            <div class="chips" id="demoChips"></div>
            <span class="sep" aria-hidden="true"></span>
            <button class="btn" id="openButton">.emg を開く</button>
            <input type="file" id="fileInput" accept=".emg,application/zip" hidden>
            <span class="drop-note">ドラッグ&amp;ドロップでも開けます</span>
        </div>
    </header>

    <div class="banner" id="banner" hidden></div>

    <main class="workspace">
        <section class="panel">
            <div class="panel-head">
                <h2>キャンバス</h2>
                <span class="dims" id="canvasDims">—</span>
                <span class="flex"></span>
                <button class="chip" id="playToggle" hidden>一時停止</button>
                <span class="src" id="sourceName">読み込み中…</span>
            </div>
            <div class="viewport checker" id="stageViewport">
                <div class="sheet" id="stageSheet">
                    <div id="stageScale">
                        <div id="layerContainer"></div>
                    </div>
                    <div class="overlay" id="stageOverlay"></div>
                </div>
                <p class="empty" id="stageEmpty">デモを選ぶか、.emg をここにドロップしてください。</p>
            </div>
            <div class="panel-foot">
                <div class="chips parts" id="partChips"></div>
                <!--
                    パーツごとの操作は、選んだ 1 つぶんだけをここに出す。
                    一覧の各行にボタンを並べると、パーツ 5 個で 15 個のボタンが常に見える。
                -->
                <div class="part-control" id="partControl" hidden>
                    <span class="ctl-name" id="ctlName"></span>
                    <button class="ctl" id="ctlShow"></button>
                    <button class="ctl" id="ctlPlay"></button>
                    <div class="frame-strip" id="ctlFrames"></div>
                </div>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head">
                <h2>アトラス</h2>
                <span class="dims" id="atlasDims">—</span>
                <span class="flex"></span>
                <div class="chips" id="texChips"></div>
                <div class="zoom" id="zoomChips">
                    <button class="zoom-item active" data-zoom="fit">全体</button>
                    <button class="zoom-item" data-zoom="1">100%</button>
                    <button class="zoom-item" data-zoom="2">200%</button>
                </div>
            </div>
            <div class="viewport atlas-viewport" id="atlasViewport">
                <div class="sheet" id="atlasSheet">
                    <img id="atlasImage" alt="テクスチャアトラス">
                    <div class="overlay" id="atlasOverlay"></div>
                </div>
            </div>
            <div class="panel-foot">
                <p class="hint">アトラスの矩形にマウスを乗せると、そのレイヤーがキャンバスのどこに置かれるかを示します。</p>
            </div>
        </section>
    </main>

    <footer class="readout" id="readout">
        <div class="readout-idle">レイヤーにマウスを乗せると、ここに座標が出ます。</div>
        <div class="readout-body" hidden>
            <div class="ident">
                <span class="part" id="roPart"></span>
                <span class="frame" id="roFrame"></span>
                <span class="tag" id="roType"></span>
            </div>
            <div class="coord coord-atlas">
                <span class="coord-label">アトラス座標</span>
                <span class="coord-val" id="roAtlas"></span>
                <span class="coord-sub">どこから取るか</span>
            </div>
            <div class="coord coord-canvas">
                <span class="coord-label">キャンバス座標</span>
                <span class="coord-val" id="roCanvas"></span>
                <span class="coord-sub">どこへ描くか</span>
            </div>
            <div class="coord">
                <span class="coord-label">z / 不透明度</span>
                <span class="coord-val" id="roMisc"></span>
                <span class="coord-sub" id="roVisible"></span>
            </div>
        </div>
    </footer>

    <div class="dropveil" id="dropVeil" hidden><span>.emg をドロップ</span></div>

    <script>
        (() => {
            'use strict';

            const DEMOS = [
                { name: 'senti', url: './assets/senti-demo.emg', note: '0.3.0 / 7 パーツ' },
                { name: 'エフェクト', url: './assets/f6ddEj.emg', note: '0.5.3 / 動きます' },
                { name: 'zunda', url: './assets/zunda.emg', note: '旧 0.1 形式' },
                { name: 'room', url: './assets/room.emg', note: '背景素材' },
            ];

            // アルファ判定用にアトラスを canvas へ写す上限。これを超えるアトラスは
            // メモリを食うので写さず、矩形の面積が小さい順に当てる方式へ落とす。
            const PROBE_LIMIT = 4096 * 4096;

            const $ = id => document.getElementById(id);
            const stageViewport = $('stageViewport'), stageSheet = $('stageSheet');
            const stageScale = $('stageScale'), stageOverlay = $('stageOverlay');
            const atlasViewport = $('atlasViewport'), atlasSheet = $('atlasSheet');
            const atlasImage = $('atlasImage'), atlasOverlay = $('atlasOverlay');
            const readout = $('readout');

            const state = {
                data: null,
                layers: [],        // 正規化したレイヤー一覧（宣言順 = data-layer-index）
                els: [],           // 対応する DOM 要素
                texes: [],         // [{ file, url, width, height, probe }]
                activeTex: 0,
                zoom: 'fit',
                hover: null,        // レイヤーの通し番号
                selectedPart: null, // 操作の対象に選んでいるパーツ
                hoverPart: null,    // 一覧でマウスが乗っているだけのパーツ
                hidden: new Set(),
                paused: new Set(),
            };

            // アイコン。ボタンに文字を並べると横幅を食い、スマホで折り返す。
            const ICON = {
                eye: '<svg viewBox="0 0 24 24"><path d="M1 12s4-7.5 11-7.5S23 12 23 12s-4 7.5-11 7.5S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/></svg>',
                eyeOff: '<svg viewBox="0 0 24 24"><path d="M2 12s4-7.5 10-7.5c1.6 0 3 .4 4.3 1M22 12s-4 7.5-10 7.5c-1.6 0-3-.4-4.3-1"/><path d="M4 3l16 18"/></svg>',
                play: '<svg viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor" stroke="none"/></svg>',
                pause: '<svg viewBox="0 0 24 24"><path d="M8 4.5v15M16 4.5v15"/></svg>',
            };

            // ---- 読み込み ------------------------------------------------------

            function showError(error) {
                const raw = error?.message ?? String(error);
                // JSZip の失敗はそのまま出すと英語 + URL で、何をすればいいか分からない。
                const message = /central directory|corrupted|zip file/i.test(raw)
                    ? 'ZIP として読めませんでした。.emg ファイルか確かめてください。'
                    : raw;
                const b = $('banner');
                b.textContent = `読み込めませんでした — ${message}`;
                b.hidden = false;
                layout();   // バナーの分だけ表示領域が縮むので倍率を取り直す
            }
            function clearError() {
                if ($('banner').hidden) return;
                $('banner').hidden = true;
                layout();
            }

            function markActiveDemo(url) {
                for (const el of $('demoChips').children) {
                    el.classList.toggle('active', el.dataset.url === url);
                }
            }

            // 見出しの更新は emg:loaded まで待つ。失敗したときに、実際に映っている
            // ものと名前が食い違わないようにするため。
            function loadDemo(demo) {
                clearError();
                window.EMGPlayer.loadEmgFromCDN(demo.url);
            }

            function loadFile(file) {
                clearError();
                window.EMGPlayer.loadEmgFromFile(file, 'layerContainer', file.name);
            }

            // ---- data.json の正規化 --------------------------------------------

            // v0.4.0 F2: 未知の type は default の有無で決める。生の type では分岐しない。
            function partType(part) {
                if (part.type === 'static' || part.type === 'switch') return part.type;
                return part.default != null ? 'switch' : 'static';
            }

            /**
             * parts[] と、0.1 系のフラットな layers[] の両方を同じ形にならす。
             * 番号はプレイヤーが振る data-layer-index と同じ順序であること。
             */
            function collectLayers(data) {
                const out = [];
                const defaultFile = data.textures?.[0]?.textureFile ?? null;
                const push = (partID, type, l) => out.push({
                    index: out.length,
                    partID, type,
                    // フレーム識別子は frameName ?? textureID。textureID 単体で参照しない。
                    frame: l.frameName ?? l.textureID ?? l.assignID ?? '—',
                    file: l.textureFile ?? defaultFile,
                    x: l.x, y: l.y, w: l.width, h: l.height,
                    bx: l.basePosition_x, by: l.basePosition_y,
                    z: l.textureZIndex ?? 0,
                    opacity: typeof l.opacity === 'number' ? l.opacity : 1,
                });

                if (Array.isArray(data.parts)) {
                    for (const part of data.parts) {
                        for (const l of part.layers) push(part.partID, partType(part), l);
                    }
                } else if (Array.isArray(data.layers)) {
                    for (const l of data.layers) push('—', '—', l);
                }
                return out;
            }

            function collectTextures(data, textures) {
                if (Array.isArray(data.textures) && data.textures.length > 0) {
                    return data.textures.map(t => ({
                        file: t.textureFile,
                        url: textures[t.textureFile],
                        width: t.width, height: t.height, probe: null,
                    }));
                }
                // 0.1 系はテクスチャ定義を持たないので、展開された画像をそのまま使う。
                const url = textures['default'] ?? Object.values(textures)[0];
                return url ? [{ file: null, url, width: 0, height: 0, probe: null }] : [];
            }

            // ---- 画面の組み立て ------------------------------------------------

            /*
             * 画面の組み立ても非同期（アトラスの読み込みを待つ）なので、
             * 待っている間に次のファイルが来ると 2 本が絡み合う。古いほうの
             * アトラスは新しい読み込みで revoke 済みなので、そのまま進むと
             * 「絵は新しいファイル・一覧は古いファイル・アトラスは 0 × 0」になる。
             */
            let loadSeq = 0;

            async function onLoaded(detail) {
                const seq = ++loadSeq;
                state.data = detail.data;
                state.layers = collectLayers(detail.data);
                state.texes = collectTextures(detail.data, detail.textures);
                state.activeTex = 0;
                state.hover = null;
                state.selectedPart = null;
                state.hoverPart = null;
                state.hidden = new Set();     // 消したパーツ / レイヤー（プレイヤーと同期）
                state.paused = new Set();     // 止めたパーツ

                const container = $('layerContainer');
                state.els = state.layers.map(l =>
                    container.querySelector(`[data-layer-index="${l.index}"]`));

                // レイヤーが textureFile を持たないファイル向けに、唯一のアトラスへ寄せる。
                if (state.texes.length === 1) {
                    for (const l of state.layers) l.file = state.texes[0].file;
                }

                $('stageEmpty').hidden = state.layers.length > 0;
                $('sourceName').textContent = String(detail.source).split('/').pop();
                markActiveDemo(detail.source);
                $('canvasDims').textContent =
                    `${detail.data.baseCanvasWidth ?? '?'} × ${detail.data.baseCanvasHeight ?? '?'} px`;

                buildTexChips();
                buildPartChips();
                updateReadout();   // 前のファイルで指していたレイヤーが残らないようにする
                // アトラスを待つ前にキャンバスだけ先に合わせる。待っている間、
                // 絵は原寸で置かれたままなので、そのままだとスクロールバーが出る。
                layoutStage();
                await showTexture(0);
                if (seq !== loadSeq) return;   // 待っている間に次のファイルが来た
                // 再生ボタンの出し入れはパネル見出しの高さを変えるので、倍率を出す前に済ませる。
                startFrameWatch();
                layout();
            }

            /**
             * 動くファイルかどうか。動かないファイルに再生ボタンを出しても押す意味がない。
             * trigger を持つ sprite（自律再生）と tracks を持つ sprite（§7 の変形）が対象。
             */
            function hasMotion() {
                return (state.data?.sprites ?? []).some(s => s.trigger || s.tracks?.length);
            }

            /**
             * 再生中は switch パーツの表示フレームが入れ替わるので、アトラス側の
             * 「いま出ている／出ていない」の表示が置いていかれる。毎コマ追うと
             * 232 枚のクラスを 50 回/秒 書き換えることになるので、10 回/秒 で足りる。
             */
            let frameWatch = null;
            function startFrameWatch() {
                clearInterval(frameWatch);
                frameWatch = null;
                const playing = hasMotion();
                $('playToggle').hidden = !playing;
                $('playToggle').textContent = '一時停止';
                if (!playing) return;
                frameWatch = setInterval(() => {
                    if (window.isAnimationRunning) syncAtlasDim();
                }, 100);
            }

            function buildTexChips() {
                const box = $('texChips');
                box.innerHTML = '';
                if (state.texes.length < 2) return;   // 1 枚なら選ぶ意味がない
                state.texes.forEach((t, i) => {
                    const b = document.createElement('button');
                    b.className = 'chip' + (i === 0 ? ' active' : '');
                    b.textContent = t.file ?? `#${i}`;
                    b.onclick = () => showTexture(i).then(layout);
                    box.appendChild(b);
                });
            }

            function buildPartChips() {
                const box = $('partChips');
                box.innerHTML = '';

                // 0.1 系はパーツを持たず、レイヤーが一列に並ぶだけ。並べても意味がないので
                // そう書く（パーツ分けが後から入った機能であることが分かるように）。
                if (!Array.isArray(state.data.parts)) {
                    const p = document.createElement('p');
                    p.className = 'hint';
                    p.textContent = `パーツ定義のない旧 0.1 形式です（レイヤー ${state.layers.length} 枚）。`;
                    box.appendChild(p);
                    return;
                }

                for (const [partID, info] of partList()) {
                    const b = document.createElement('button');
                    b.className = 'chip part-chip';
                    b.dataset.part = partID;
                    b.innerHTML =
                        `<span class="chip-type ${info.type}">${info.type}</span>` +
                        `<span>${escapeHtml(partID)}</span>` +
                        `<span class="chip-count">${info.n}</span>`;
                    b.onmouseenter = () => { state.hoverPart = partID; applyHighlight(); };
                    b.onmouseleave = () => { state.hoverPart = null; applyHighlight(); };
                    b.onclick = () => selectPart(state.selectedPart === partID ? null : partID);
                    box.appendChild(b);
                }
                selectPart(null);
            }

            function partList() {
                const parts = new Map();
                for (const l of state.layers) {
                    if (!parts.has(l.partID)) parts.set(l.partID, { type: l.type, n: 0 });
                    parts.get(l.partID).n++;
                }
                return parts;
            }

            /** そのパーツが自分で動くか（sprite を持つか）。 */
            function partHasMotion(partID) {
                return (state.data?.sprites ?? []).some(s =>
                    s.targetPartID === partID && (s.trigger || s.tracks?.length));
            }

            // ---- 選んだパーツの操作 ---------------------------------------------

            function selectPart(partID) {
                state.selectedPart = partID;
                for (const c of $('partChips').children) {
                    if (c.dataset) c.classList.toggle('active', c.dataset.part === partID);
                }
                const had = !$('partControl').hidden;
                renderPartControl();
                // 操作の帯が出入りすると絵の欄の高さが変わる。倍率は出したときの
                // 高さで決めているので、取り直さないとキャンバスがはみ出して
                // スクロールバーが生える。
                if (had !== !$('partControl').hidden) layout();
                applyHighlight();
            }

            function renderPartControl() {
                const box = $('partControl');
                const partID = state.selectedPart;
                box.hidden = !partID;
                if (!partID) return;

                const info = partList().get(partID);
                const shown = !state.hidden.has(partID);
                $('ctlName').textContent = partID;

                const show = $('ctlShow');
                show.innerHTML = shown ? ICON.eye : ICON.eyeOff;
                show.title = shown ? 'このパーツを隠す' : 'このパーツを出す';
                show.classList.toggle('off', !shown);
                show.onclick = () => {
                    const next = state.hidden.has(partID);
                    if (next) state.hidden.delete(partID); else state.hidden.add(partID);
                    window.EMGPlayer.showPart(partID, next);
                    renderPartControl();
                    refreshChipStates();
                    syncAtlasDim();
                };

                const play = $('ctlPlay');
                const moves = partHasMotion(partID);
                play.hidden = !moves;
                if (moves) {
                    const running = !state.paused.has(partID);
                    play.innerHTML = running ? ICON.pause : ICON.play;
                    play.title = running ? 'このパーツだけ止める' : 'このパーツだけ動かす';
                    play.classList.toggle('off', !running);
                    play.onclick = () => setPartPlaying(partID, state.paused.has(partID));
                }

                renderFrameStrip(partID, info);
            }

            function setPartPlaying(partID, playing) {
                if (playing) state.paused.delete(partID); else state.paused.add(partID);
                window.EMGPlayer.setPartPlaying(partID, playing);
                renderPartControl();
                refreshChipStates();
            }

            /**
             * switch なら「どのコマを出すか」、static なら「どのレイヤーを出すか」。
             * 形式が持つ static / switch の違いがそのまま操作の違いになるので、
             * 同じ帯で見せて中身だけ変える。
             */
            function renderFrameStrip(partID, info) {
                const strip = $('ctlFrames');
                strip.innerHTML = '';
                const mine = state.layers.filter(l => l.partID === partID);
                if (mine.length < 2 && info?.type !== 'switch') return;

                if (info?.type === 'switch') {
                    // frameName で複数レイヤーが同じ識別子を共有しうるので、識別子で畳む。
                    const frames = [...new Set(mine.map(l => l.frame))];
                    for (const frame of frames) {
                        const first = mine.find(l => l.frame === frame);
                        const b = document.createElement('button');
                        b.className = 'frame-chip';
                        b.textContent = frame;
                        b._layers = mine.filter(l => l.frame === frame).map(l => l.index);
                        b.onmouseenter = () => setHover(first.index);
                        b.onclick = () => {
                            // 動いているパーツで選ぶと次のコマで塗り替えられる。止めてから出す。
                            if (partHasMotion(partID) && !state.paused.has(partID)) {
                                setPartPlaying(partID, false);
                            }
                            window.EMGPlayer.setFrame(partID, frame);
                            syncAtlasDim();
                            refreshFrameStrip();
                        };
                        strip.appendChild(b);
                    }
                } else {
                    for (const l of mine) {
                        const b = document.createElement('button');
                        b.className = 'frame-chip';
                        b.textContent = l.frame;
                        b._layers = [l.index];
                        b.onmouseenter = () => setHover(l.index);
                        b.onclick = () => {
                            const next = !isVisible(l.index);
                            window.EMGPlayer.showLayer(l.index, next);
                            syncAtlasDim();
                            refreshFrameStrip();
                        };
                        strip.appendChild(b);
                    }
                }
                strip.onmouseleave = () => setHover(null);
                refreshFrameStrip();
            }

            /**
             * 帯のどれが「いま出ている」かを画面から取り直す。
             * 再生中は 10 回/秒 呼ばれるので、どのレイヤーを見ればいいかは
             * 帯を作るときに決めておく（毎回 232 コマ × 232 レイヤーを突き合わせない）。
             */
            function refreshFrameStrip() {
                for (const b of $('ctlFrames').children) {
                    b.classList.toggle('previewing', (b._layers ?? []).some(isVisible));
                }
            }

            function refreshChipStates() {
                for (const c of $('partChips').children) {
                    const partID = c.dataset?.part;
                    if (!partID) continue;
                    c.classList.toggle('off', state.hidden.has(partID));
                    c.classList.toggle('held', state.paused.has(partID));
                }
            }

            async function showTexture(i) {
                state.activeTex = i;
                for (const [j, el] of [...$('texChips').children].entries()) {
                    el.classList.toggle('active', j === i);
                }
                const tex = state.texes[i];
                if (!tex) { atlasImage.removeAttribute('src'); return; }

                // 大きさが決まるまで場所を取らせない。8192px のアトラスは
                // 読み終えた瞬間に原寸で描かれ、layout() が寸法を入れるまでの間
                // パネルからあふれてスクロールバーが出る。
                atlasImage.classList.add('sizing');
                atlasSheet.style.width = atlasSheet.style.height = '0px';

                atlasImage.src = tex.url;
                // decode() ではなく load を待つ。バックグラウンドのタブでは
                // デコードが後回しにされて decode() が返らず、そこで止まってしまう。
                await new Promise(done => {
                    if (atlasImage.complete && atlasImage.naturalWidth) return done();
                    atlasImage.onload = atlasImage.onerror = done;
                });
                // 待っている間に別のアトラスへ差し替わっていたら、こちらは書かない。
                if (atlasImage.src !== tex.url) return;
                // 表示の寸法は宣言値ではなく実物から取る。両者が食い違うファイルがあるため。
                tex.width = atlasImage.naturalWidth;
                tex.height = atlasImage.naturalHeight;
                $('atlasDims').textContent = `${tex.width} × ${tex.height} px`;

                if (!tex.probe && tex.width * tex.height <= PROBE_LIMIT) {
                    const c = document.createElement('canvas');
                    c.width = tex.width; c.height = tex.height;
                    const ctx = c.getContext('2d', { willReadFrequently: true });
                    ctx.drawImage(atlasImage, 0, 0);
                    tex.probe = ctx;
                }
            }

            // ---- 配置（拡大率の算出とオーバーレイ）------------------------------

            function scaleToFit(vp, w, h) {
                if (!w || !h) return 1;
                const pad = 24;
                return Math.min(1,
                    (vp.clientWidth - pad) / w,
                    (vp.clientHeight - pad) / h);
            }

            /**
             * キャンバス側だけ合わせる。
             *
             * アトラスの読み込みを待たずに呼べることが要る。プレイヤーは
             * レイヤーを並べ終えてから emg:loaded を出すので、ここで倍率を
             * 決めるまでの間、絵は原寸のまま置かれている。8192px のアトラスだと
             * その間が数秒あり、ずっとスクロールバーが出たままになる。
             */
            function layoutStage() {
                if (!state.data) return;
                const cw = state.data.baseCanvasWidth || 1, ch = state.data.baseCanvasHeight || 1;
                const ks = scaleToFit(stageViewport, cw, ch);
                stageSheet.style.width = `${cw * ks}px`;
                stageSheet.style.height = `${ch * ks}px`;
                stageScale.style.transform = `scale(${ks})`;
                state.stageScale = ks;
            }

            function layout() {
                if (!state.data) return;

                layoutStage();

                // アトラス側
                const tex = state.texes[state.activeTex];
                const ka = !tex ? 1
                    : state.zoom === 'fit' ? scaleToFit(atlasViewport, tex.width, tex.height)
                        : Number(state.zoom);
                state.atlasScale = ka;
                if (tex) {
                    atlasImage.style.width = `${tex.width * ka}px`;
                    atlasImage.style.height = `${tex.height * ka}px`;
                    atlasSheet.style.width = `${tex.width * ka}px`;
                    atlasSheet.style.height = `${tex.height * ka}px`;
                    atlasImage.classList.remove('sizing');
                }

                renderOverlays();
            }

            /** そのレイヤーがいま画面に出ているか（switch の非選択フレームは出ていない）。 */
            function isVisible(index) {
                const el = state.els[index];
                return !!el && el.style.display !== 'none';
            }

            function renderOverlays() {
                const tex = state.texes[state.activeTex];
                atlasOverlay.innerHTML = '';
                stageOverlay.innerHTML = '';
                if (!tex) return;

                const ka = state.atlasScale;
                for (const l of state.layers) {
                    if (l.file !== tex.file) continue;
                    const r = document.createElement('div');
                    r.className = 'rect' + (isVisible(l.index) ? '' : ' dim');
                    r.dataset.index = String(l.index);
                    r.style.left = `${l.x * ka}px`;
                    r.style.top = `${l.y * ka}px`;
                    r.style.width = `${l.w * ka}px`;
                    r.style.height = `${l.h * ka}px`;
                    r.onmouseenter = () => setHover(l.index);
                    // タッチにはホバーが無いので、触れた時点で指したことにする。
                    r.onpointerdown = () => setHover(l.index);
                    atlasOverlay.appendChild(r);
                }
                atlasOverlay.onmouseleave = () => setHover(null);
                applyHighlight();
            }

            /** アトラスの矩形の「いま出ている／出ていない」を画面から取り直す。 */
            function syncAtlasDim() {
                for (const r of atlasOverlay.children) {
                    r.classList.toggle('dim', !isVisible(Number(r.dataset.index)));
                }
                refreshFrameStrip();
                updateReadout();   // 「いまは非表示」の行が切り替え前のまま残らないように
            }

            // ---- ハイライトと読み取り ------------------------------------------

            function setHover(index) {
                if (state.hover === index) return;
                state.hover = index;
                applyHighlight();
                updateReadout();
            }

            function applyHighlight() {
                const hovered = state.hover;
                const part = state.selectedPart ?? state.hoverPart ?? null;

                for (const r of atlasOverlay.children) {
                    const i = Number(r.dataset.index);
                    r.classList.toggle('hot', i === hovered);
                    r.classList.toggle('kin', part != null && state.layers[i].partID === part && i !== hovered);
                }

                stageOverlay.innerHTML = '';
                const ks = state.stageScale;
                const draw = (l, cls) => {
                    const d = document.createElement('div');
                    d.className = `rect ${cls}`;
                    d.style.left = `${l.bx * ks}px`;
                    d.style.top = `${l.by * ks}px`;
                    d.style.width = `${l.w * ks}px`;
                    d.style.height = `${l.h * ks}px`;
                    stageOverlay.appendChild(d);
                };
                if (part != null) {
                    for (const l of state.layers) {
                        if (l.partID === part && l.index !== hovered && isVisible(l.index)) draw(l, 'kin');
                    }
                }
                if (hovered != null) {
                    draw(state.layers[hovered], 'hot');
                    const label = document.createElement('div');
                    const l = state.layers[hovered];
                    // 既定では矩形の上に出す。上端に近いレイヤーだと切り取られて
                    // 見えなくなるので、そのときだけ矩形の中へ入れる。
                    const above = l.by * ks >= 20;
                    label.className = `rect-label${above ? '' : ' inside'}`;
                    label.textContent = `${l.partID} / ${l.frame}`;
                    label.style.left = `${l.bx * ks}px`;
                    label.style.top = `${l.by * ks}px`;
                    stageOverlay.appendChild(label);
                }
            }

            function updateReadout() {
                const idle = readout.querySelector('.readout-idle');
                const body = readout.querySelector('.readout-body');
                if (state.hover == null) { idle.hidden = false; body.hidden = true; return; }
                idle.hidden = true; body.hidden = false;

                const l = state.layers[state.hover];
                $('roPart').textContent = l.partID;
                $('roFrame').textContent = l.frame;
                $('roType').textContent = l.type;
                $('roType').className = `tag ${l.type}`;
                // basePosition は整数とは限らない（0.5 系のファイルに小数が入る）。
                // 二進小数の桁を全部出すと読めないので丸める。
                const num = v => typeof v === 'number' ? String(Math.round(v * 100) / 100) : String(v);
                $('roAtlas').textContent = `x ${num(l.x)}, y ${num(l.y)} · ${num(l.w)} × ${num(l.h)}`;
                $('roCanvas').textContent = `x ${num(l.bx)}, y ${num(l.by)}`;
                $('roMisc').textContent = `${num(l.z)} / ${num(l.opacity)}`;
                $('roVisible').textContent = isVisible(l.index) ? '表示中' : 'いまは非表示';
            }

            // ---- キャンバス側からの当たり判定 ----------------------------------

            /**
             * キャンバス座標 (cx, cy) にあるレイヤーを前面から探す。
             * アトラスを写した canvas があれば実際のアルファを見る。無ければ
             * 面積の小さいものを優先する（口や目のような小さな差分を拾うため）。
             */
            function pickAt(cx, cy) {
                const hits = state.layers.filter(l =>
                    isVisible(l.index) &&
                    cx >= l.bx && cx < l.bx + l.w && cy >= l.by && cy < l.by + l.h);
                if (hits.length === 0) return null;

                hits.sort((a, b) => b.z - a.z);
                for (const l of hits) {
                    const tex = state.texes.find(t => t.file === l.file) ?? state.texes[0];
                    if (!tex?.probe) continue;
                    const px = l.x + (cx - l.bx), py = l.y + (cy - l.by);
                    if (tex.probe.getImageData(px, py, 1, 1).data[3] > 8) return l.index;
                }
                if (state.texes.some(t => t.probe)) return null;   // 判定できたが全部透明
                hits.sort((a, b) => a.w * a.h - b.w * b.h);
                return hits[0].index;
            }

            let pending = null;
            const pickFromEvent = e => {
                if (!state.data || pending) return;
                pending = requestAnimationFrame(() => {
                    pending = null;
                    const box = stageSheet.getBoundingClientRect();
                    const cx = Math.floor((e.clientX - box.left) / state.stageScale);
                    const cy = Math.floor((e.clientY - box.top) / state.stageScale);
                    setHover(pickAt(cx, cy));
                });
            };
            stageViewport.addEventListener('mousemove', pickFromEvent);
            // タッチはホバーしないので、触れた点で拾う。
            stageViewport.addEventListener('pointerdown', pickFromEvent);
            stageViewport.addEventListener('mouseleave', () => setHover(null));

            // ---- 入り口 --------------------------------------------------------

            function escapeHtml(s) {
                return String(s).replace(/[&<>"]/g, c =>
                    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            }

            for (const demo of DEMOS) {
                const b = document.createElement('button');
                b.className = 'chip';
                b.dataset.url = demo.url;
                b.innerHTML = `<span>${escapeHtml(demo.name)}</span><span class="chip-count">${escapeHtml(demo.note)}</span>`;
                b.onclick = () => loadDemo(demo);
                $('demoChips').appendChild(b);
            }

            $('playToggle').onclick = () => {
                window.EMGPlayer.toggleAnimation();
                $('playToggle').textContent = window.isAnimationRunning ? '一時停止' : '再生';
                // 止めた位置のフレームで矩形を合わせ直す（止めてから見るのが普通なので）。
                syncAtlasDim();
            };

            // 横に流れる帯はスクロールバーを出していないので、ふつうの縦ホイールで
            // 横に動くようにする（マウスだけだと他に動かす手が無い）。
            for (const el of [$('partChips'), $('ctlFrames'), document.querySelector('.loaders')]) {
                el.addEventListener('wheel', e => {
                    if (e.deltaY === 0 || el.scrollWidth <= el.clientWidth) return;
                    e.preventDefault();
                    el.scrollLeft += e.deltaY;
                }, { passive: false });
            }

            $('openButton').onclick = () => $('fileInput').click();
            $('fileInput').onchange = e => {
                const file = e.target.files?.[0];
                if (file) loadFile(file);
                e.target.value = '';
            };

            for (const b of $('zoomChips').children) {
                b.onclick = () => {
                    state.zoom = b.dataset.zoom;
                    for (const o of $('zoomChips').children) o.classList.toggle('active', o === b);
                    layout();
                };
            }

            let dragDepth = 0;
            window.addEventListener('dragenter', e => {
                e.preventDefault(); dragDepth++; $('dropVeil').hidden = false;
            });
            window.addEventListener('dragover', e => e.preventDefault());
            window.addEventListener('dragleave', () => {
                if (--dragDepth <= 0) { dragDepth = 0; $('dropVeil').hidden = true; }
            });
            window.addEventListener('drop', e => {
                e.preventDefault(); dragDepth = 0; $('dropVeil').hidden = true;
                const file = e.dataTransfer?.files?.[0];
                if (file) loadFile(file);
            });

            window.addEventListener('emg:loaded', e => { onLoaded(e.detail); });
            window.addEventListener('emg:error', e => {
                showError(e.detail.error);
                // 失敗しても前の内容はそのまま残る（プレイヤーが読めるまで差し替えない）。
                // 何も出ていないときだけ案内を出す。
                if (!state.data) $('stageEmpty').hidden = false;
            });
            window.addEventListener('resize', layout);

            document.addEventListener('DOMContentLoaded', () => loadDemo(DEMOS[0]));
        })();
    </script>
</body>

</html>
