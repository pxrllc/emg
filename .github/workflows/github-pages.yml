name: Deploy to GitHub Pages

# 現在このサイトは「準備中」ページのみを配信している。
#
# GitHub Pages 自体はリポジトリのポリシー上 API から無効化できない
# （DELETE /repos/{owner}/{repo}/pages が 422 "Deactivating GitHub pages for this
# repository is not allowed." を返す）ため、代わりに配信内容を空のプレースホルダに
# 差し替えることで実質的に非公開としている。
#
# 公開を再開するときは、下の「Build site」ステップをコメントアウトされている
# 本来の処理に戻す:
#   /          → emg-cdn（リファレンスプレイヤー + デモ）
#   /runtime/  → emg-web-runtime
#   /packer/   → emg-web-packer（未実装）

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同時に走ったデプロイ同士が競合しないようにする。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build site (placeholder only)
        run: |
          mkdir -p _site
          cp .github/pages-placeholder/index.html _site/index.html

      # --- 公開を再開するときはここから下を有効化する ---
      # - uses: actions/setup-node@v5
      #   with:
      #     node-version: 22
      #
      # - name: Collect emg-cdn (site root)
      #   run: cp -r emg-cdn/. _site/
      #
      # - name: Build emg-web-runtime (/runtime/)
      #   working-directory: emg-web-runtime
      #   run: |
      #     npm ci
      #     npm run build
      #
      # - name: Place emg-web-runtime
      #   run: |
      #     mkdir -p _site/runtime
      #     cp -r emg-web-runtime/dist/. _site/runtime/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
