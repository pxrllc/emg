name: Deploy to GitHub Pages

# EMG の Web 系成果物をまとめて1サイトとして配信する。
#   /          → emg-cdn（リファレンスプレイヤー + デモ）
#   /runtime/  → emg-web-runtime
#   /packer/   → emg-web-packer（PSD → .emg 変換）
#   /editor/   → emg-editor（アバター編集。Electron 版と同一のコード）
#
# サイトを一時的に閉じたい場合は、下の各ビルドステップを
# 「Build placeholder only」に差し替える（.github/pages-placeholder/index.html を配信する）。
# GitHub Pages 自体はリポジトリのポリシー上 API から無効化できないため
# （DELETE /repos/{owner}/{repo}/pages が 422 を返す）、配信内容の差し替えで対応する。

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同時に走ったデプロイ同士が競合しないようにする。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collect emg-cdn (site root)
        run: |
          mkdir -p _site
          cp -r emg-cdn/. _site/

      - name: Build emg-web-runtime (/runtime/)
        working-directory: emg-web-runtime
        run: |
          npm ci
          npm run build

      - name: Build emg-web-packer (/packer/)
        working-directory: emg-web-packer
        run: |
          npm ci
          npm run build

      # emg-editor は Electron 版とまったく同じ renderer をブラウザ向けに出力する
      # （src/renderer/ が Electron API に依存していないため、別アプリは不要）。
      - name: Build emg-editor (/editor/)
        working-directory: emg-editor
        run: |
          npm ci
          npm run build:web

      - name: Place built apps
        run: |
          mkdir -p _site/runtime _site/packer _site/editor
          cp -r emg-web-runtime/dist/. _site/runtime/
          cp -r emg-web-packer/dist/. _site/packer/
          cp -r emg-editor/dist-web/. _site/editor/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
